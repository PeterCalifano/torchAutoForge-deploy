name: build_ros2_overlay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/build_ros2_overlay.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'build_ros2.sh'
      - 'cmake/**'
      - 'generate_version.sh'
      - 'ros2/**'
      - 'src/**'
      - 'tests/matlab/testSamples/tracedSampleModel.onnx'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/build_ros2_overlay.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'build_ros2.sh'
      - 'cmake/**'
      - 'generate_version.sh'
      - 'ros2/**'
      - 'src/**'
      - 'tests/matlab/testSamples/tracedSampleModel.onnx'

concurrency:
  group: ptafdeploy-ros2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ORT_VERSION: '1.23.0'

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ros:jazzy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            libeigen3-dev \
            python3-colcon-common-extensions \
            python3-pip \
            ros-dev-tools \
            tar
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Setup ONNX Runtime
        shell: bash
        run: |
          ort_root="$(
            "${GITHUB_WORKSPACE}/.github/scripts/install_onnxruntime.sh" \
              x86_64 "${GITHUB_WORKSPACE}/.ci_deps/onnxruntime"
          )"
          {
            echo "ONNXRUNTIME_ROOT=${ort_root}"
            echo "onnxruntime_DIR=${ort_root}/lib/cmake/onnxruntime"
            echo "LD_LIBRARY_PATH=${ort_root}/lib:${LD_LIBRARY_PATH:-}"
          } >> "${GITHUB_ENV}"

      - name: Verify synchronized metadata
        shell: bash
        run: |
          ./generate_version.sh --sync-ros2
          git diff --exit-code -- ros2/*/package.xml

      - name: Resolve ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths ros2 --ignore-src -r -y --rosdistro jazzy

      - name: Build and test target overlay
        shell: bash
        run: ./build_ros2.sh --clean --no-version-sync
